name: Retired Legacy Package Publish

# This filename is retained so an old bookmarked workflow gives an explicit
# recovery direction. Tag pushes must never regain a token-authenticated route.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the supported release routes
        run: |
          echo "The tag-based publisher is retired."
          echo "For an inaugural 0.1.0 package, use First Publish Selection with the npm-production environment."
          echo "For later versions, use release-changesets.yml and npm stage publish via trusted OIDC."
