name: Validate Diagrams

on:
  pull_request:
    paths:
      - "docs/**/*.mermaid"
      - "specs/diagrams/**/*.mermaid"
      - "examples/**/*.mermaid"
      # A hash input since ISS-046: a theme edit redraws every diagram while no .mermaid moves,
      # so without this the workflow would not run for the change that invalidated all 43.
      - "specs/diagrams/mermaid.config.json"
  push:
    branches:
      - main
      - develop
    paths:
      - "docs/**/*.mermaid"
      - "specs/diagrams/**/*.mermaid"
      - "examples/**/*.mermaid"
      # A hash input since ISS-046: a theme edit redraws every diagram while no .mermaid moves,
      # so without this the workflow would not run for the change that invalidated all 43.
      - "specs/diagrams/mermaid.config.json"
  # Manually triggered or scheduled validation
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 3" # Every Wednesday at 14:00 UTC

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/reusable-validate-docs.yml
    with:
      # STRICT, and no browser (ISS-046). `diagrams:check` verifies a recorded source hash
      # instead of re-rendering and diffing bytes, so it reaches the same verdict on every machine
      # in ~50ms. `REFARM_DIAGRAM_SYNC_STRICT=0` was here because a byte comparison could fail on an
      # environmental difference — a font the runner lacked — and that cannot happen now.
      validation-command: pnpm run diagrams:check
      validation-name: Diagrams
      validation-cache-files: |
        docs/**/*.mermaid
        specs/diagrams/**/*.mermaid
        examples/**/*.mermaid
        specs/diagrams/mermaid.config.json
        scripts/check-diagrams.mjs
        scripts/ci/install-puppeteer-browser.mjs
        scripts/puppeteer-no-sandbox.json
        pnpm-lock.yaml
        .github/workflows/validate-diagrams.yml
        .github/workflows/reusable-validate-docs.yml
      create-issue-on-failure: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      issue-title: "Mermaid diagram validation failed"
      issue-labels: "documentation,diagrams,validation"
      is-pr: ${{ github.event_name == 'pull_request' }}
      pr-number: ${{ github.event.pull_request.number }}
