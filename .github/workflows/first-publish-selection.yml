name: First Publish Selection

on:
  workflow_dispatch:
    inputs:
      selection:
        description: "Release policy selection to publish at its declared 0.1.0 versions"
        required: true
        default: "vault-seed-ready"
        type: string
      dry_run:
        description: "Run publish dry-runs only"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      confirm:
        description: "Required when dry_run=false: publish-<selection>-0.1.0"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  first-publish:
    if: vars.RELEASE_AUTOMATION == 'true' && (vars.RELEASE_OWNER == '' || github.repository_owner == vars.RELEASE_OWNER)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: "0"

      - name: Setup
        id: setup
        uses: ./.github/actions/setup
        with:
          cache-mode: "off"

      - name: Setup Refarm Environment
        run: node scripts/ci/setup-env.mjs

      - name: Release policy plan
        env:
          REFARM_FIRST_PUBLISH_SELECTION: ${{ inputs.selection }}
        run: pnpm --silent run release:first-publish:plan -- --selection "$REFARM_FIRST_PUBLISH_SELECTION" --json

      - name: Release boundary audit
        run: pnpm --silent run release:boundary:audit

      - name: Publish dry-run gate
        env:
          REFARM_FIRST_PUBLISH_SELECTION: ${{ inputs.selection }}
        run: pnpm --silent run release:first-publish:check -- --selection "$REFARM_FIRST_PUBLISH_SELECTION"

      - name: First-publish dry-run
        if: inputs.dry_run == 'true'
        env:
          REFARM_FIRST_PUBLISH_SELECTION: ${{ inputs.selection }}
        run: pnpm --silent run release:first-publish -- --selection "$REFARM_FIRST_PUBLISH_SELECTION" --plan --json

      - name: Validate publish confirmation
        if: inputs.dry_run == 'false'
        env:
          REFARM_FIRST_PUBLISH_SELECTION: ${{ inputs.selection }}
          REFARM_FIRST_PUBLISH_CONFIRM: ${{ inputs.confirm }}
        run: test "$REFARM_FIRST_PUBLISH_CONFIRM" = "publish-${REFARM_FIRST_PUBLISH_SELECTION}-0.1.0"

      - name: Configure npm authentication
        if: inputs.dry_run == 'false'
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Publish 0.1.0 packages
        if: inputs.dry_run == 'false'
        env:
          REFARM_FIRST_PUBLISH_SELECTION: ${{ inputs.selection }}
          REFARM_FIRST_PUBLISH_CONFIRM: ${{ inputs.confirm }}
        run: pnpm --silent run release:first-publish -- --selection "$REFARM_FIRST_PUBLISH_SELECTION" --publish --confirm "$REFARM_FIRST_PUBLISH_CONFIRM"
