name: Clean-room Verify

# The deterministic backstop for the local↔CI gap. Per-push runs lean on a WARM Turbo
# cache: a package whose inputs did not change serves its last green result, so a latent
# failure (an undeclared @types/node, a stale build artifact, a drifted contract) stays
# hidden until some unrelated change invalidates its cache and it surfaces at a random
# time. This job runs cache-COLD — fresh install, `--force`, a throwaway cache dir — so
# every type-check / test / lint re-executes and ALL such latent failures surface together
# on a schedule, not one-by-one via cache roulette.
#
# Scheduled runs verify the default branch; use the manual dispatch to verify any branch.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *" # Daily at 04:00 UTC
  # PRE-MERGE GATE: run cache-cold on every PR targeting main (the develop→main promotion), so a
  # latent failure the warm-cache per-push runs hide is surfaced BEFORE it merges into a release —
  # not a day later on the schedule. Mark this job a required status check in branch protection to
  # actually block the merge (that lives in repo settings, not this file).
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Per-ref so a PR run, another PR, and the scheduled run don't cancel each other.
  group: clean-room-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-room:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: "0"

      # Deliberately NO turbo-cache-api/token: the remote cache is left unset so this run
      # cannot restore a prior result. Combined with `--force` + a fresh cache dir below,
      # the whole task graph re-executes from a clean install.
      - name: Setup (fresh install, cache-cold)
        uses: ./.github/actions/setup
        with:
          rust-target: "wasm32-wasip1"

      # The hardening collector proves a suite conformant by IMPORTING each package's built
      # artifact (packages/hardening/src/collect.ts), and its test depends only on its OWN build —
      # so on a cold graph it runs while most of the workspace is still unbuilt and its floors read
      # low (18 conformant here against 24 on a built tree; PR #59, 2026-08-30). The quality job
      # pre-builds for exactly this reason; this lane now does the same, still cold: --force, the
      # fresh per-run cache dir, no remote cache.
      - name: Cache-cold build (whole workspace, --force)
        run: >-
          pnpm turbo run build
          --force
          --cache-dir=.turbo-clean-room
          --output-logs=errors-only
          --ui=stream

      # No --force here on purpose: the build artifacts above are the only thing in the fresh
      # cache dir, so type-check/test/lint still execute for the first time while their build
      # dependencies are reused instead of rebuilt a second time.
      - name: Cache-cold verify (type-check + test + lint)
        run: >-
          pnpm turbo run type-check test lint
          --cache-dir=.turbo-clean-room
          --output-logs=new-only
          --ui=stream

      - name: Note on failure
        if: failure()
        run: |
          echo "::error::Clean-room verify found a latent failure the warm-cache per-push runs hide."
          echo "A red here means a type-check/test/lint that only fails on a clean build — fix at the source (declare the dep, rebuild the artifact, reconcile the contract)." >> "$GITHUB_STEP_SUMMARY"
