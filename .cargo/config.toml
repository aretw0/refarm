[build]
# Limit parallel codegen units to avoid OOM on 8GB host machines.
# 16 jobs default on this 16-core container exhausts RAM during heavy
# Rust builds (each unit peaks ~400MB). 4 keeps peak under ~2GB.
jobs = 4
# Keep build artifacts in the workspace cache so dev shells, containers, and
# sandboxed agents all share a writable target dir.
#
# RELATIVE ON PURPOSE: cargo resolves a relative `target-dir` against the directory holding
# this config, not the current one — so every crate in the repo shares `<repo>/.cache/cargo-target`
# no matter where the build is invoked from. In the devcontainer the repo IS /workspaces/refarm,
# so this resolves to the same path it always did; on a host checkout it resolves there instead
# of failing to create /workspaces. `CARGO_TARGET_DIR` still overrides it for a separate volume.
target-dir = ".cache/cargo-target"

[profile.dev]
# Reduce per-crate memory during dev/test builds.
# 16 codegen units (default) parallelises within a crate; 4 halves peak RSS.
codegen-units = 4

[profile.test]
inherits = "dev"
codegen-units = 4

[profile.release]
# WASM component builds: single codegen unit = smaller binary + lower peak RAM.
codegen-units = 1
