[package]
name = "refarm-identity-provider-ref"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.41.0"
wit-bindgen-rt = "0.41.0"
# Same ed25519 primitive the heartwood core uses — but here the SigningKey lives
# inside the module and is never returned across the WIT boundary. default-features
# = false drops the `std`/`rand_core` machinery that would pull `getrandom` and,
# with it, the whole WASI import surface: this crate needs NO randomness (keys are
# derived deterministically from a seed), so the component can import nothing but
# the plugin bridge. Absence of imports IS the sandbox.
ed25519-dalek = { version = "2.2", default-features = false }
sha2 = { version = "0.10", default-features = false }
# For the identity:whoami dispatch handler: parse the {verb, replyRef} payload and
# build the DispatchResult node. default-features off keeps it no_std-friendly (alloc).
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "z"
lto = true
strip = true

[package.metadata.component]
package = "plugin:host"

[package.metadata.component.target]
# The identity-plugin world: `include plugin` (imports only tractor-bridge,
# exports integration) + exports identity-provider. Smallest world that carries
# the sovereign signer — no host-fs/shell/model, so the key has nowhere to leak
# even if the code tried.
path = "../plugin-wit/wit"
world = "identity-plugin"
