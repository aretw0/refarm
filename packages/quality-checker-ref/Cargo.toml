[package]
name = "refarm-quality-checker-ref"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.41.0"
wit-bindgen-rt = "0.41.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[package.metadata.component]
package = "plugin:quality-checker-ref"

# Target the canonical quality-checker world directly — no wit copy, so the
# reference checker can never drift from the contract in packages/quality-contract-v1.
[package.metadata.component.target]
path = "../quality-contract-v1/wit"
world = "quality-checker"
