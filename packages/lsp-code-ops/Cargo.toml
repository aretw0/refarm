[package]
name = "lsp-code-ops"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.36"
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true

[package.metadata.component]
package = "host:plugin"

[package.metadata.component.target]
path = "../plugin-wit/wit"
world = "effect-capable"
